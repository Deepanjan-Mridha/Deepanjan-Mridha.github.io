name: Fetch Google Scholar Publications

# Controls when the workflow will run
on:
  # Schedule to run at 00:00 (midnight) every Sunday
  schedule:
    - cron: '0 0 * * 0'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant permissions needed to commit files back to the repository
permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scholarly

      # 4. Run the Python script to fetch publications
      - name: Run fetch script
        run: python fetch_publications.py

      # 5. Commit and push the updated publications.json if there are changes
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "Auto-update publications from Google Scholar" || echo "No changes to commit"
          git push
